<div class="page-content">
  <div class="page-header">
    <div>
      <h4><i class="fas fa-arrows-rotate me-2" style="color:var(--primary)"></i>Movimientos de Inventario</h4>
      <small class="text-muted">Registrar y administrar entradas y salidas de stock por sucursal</small>
    </div>
    <div class="d-flex gap-2">
      <button class="btn btn-primary ripple" id="btnNuevoMovimiento">
        <i class="fas fa-plus me-1"></i> Nuevo Movimiento
      </button>
      <button class="btn btn-outline-success ripple" id="btnExportMovExcel">
        <i class="fas fa-file-excel me-1"></i> Excel
      </button>
      <button class="btn btn-outline-danger ripple" id="btnExportMovPdf">
        <i class="fas fa-file-pdf me-1"></i> PDF
      </button>
    </div>
  </div>

  <div class="filter-bar filter-bar-5cols">
    <div>
      <label class="form-label mb-1 small text-muted">Sucursal</label>
      <select class="form-select" id="filterMovSucursal">
        <option value="">Cargando...</option>
      </select>
    </div>
    <div>
      <label class="form-label mb-1 small text-muted">Producto</label>
      <select class="form-select" id="filterMovProducto">
        <option value="">Todos</option>
      </select>
    </div>
    <div>
      <label class="form-label mb-1 small text-muted">Desde</label>
      <input type="date" class="form-control" id="filterMovFechaInicio">
    </div>
    <div>
      <label class="form-label mb-1 small text-muted">Hasta</label>
      <input type="date" class="form-control" id="filterMovFechaFin">
    </div>
    <div>
      <label class="form-label mb-1 small text-muted">Tipo</label>
      <select class="form-select" id="filterMovTipo">
        <option value="">Todos</option>
        <option value="ENTRADA">Entrada</option>
        <option value="SALIDA">Salida</option>
      </select>
    </div>
  </div>

  <div class="panel-card overflow-hidden">
    <div class="table-responsive">
      <table class="table table-custom mb-0">
        <thead>
          <tr>
            <th>Fecha</th>
            <th>Tipo</th>
            <th>Producto</th>
            <th>Detalle</th>
            <th>Cantidad</th>
            <th>Stock</th>
            <th>Sucursal</th>
            <th>Responsable</th>
          </tr>
        </thead>
        <tbody id="tableMovBody">
          <tr><td colspan="8"><div class="empty-state"><i class="fas fa-arrows-rotate"></i><p>Cargando...</p></div></td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="mt-3" id="paginationMov"></div>
</div>

<div class="modal fade" id="movimientoModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow">
      <div class="modal-header border-0">
        <h5 class="modal-title fw-bold" id="movimientoModalTitle">Nuevo Movimiento</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="formMovimiento">
          <div class="mb-3">
            <label class="form-label">Producto <span class="text-danger">*</span></label>
            <select class="form-select" id="movProducto" required>
              <option value="">Selecciona un producto...</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Sucursal <span class="text-danger">*</span></label>
            <select class="form-select" id="movSucursal" required>
              <option value="">Selecciona una sucursal...</option>
            </select>
            <div class="form-text" id="movStockInfo"></div>
          </div>
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Tipo de Movimiento <span class="text-danger">*</span></label>
              <select class="form-select" id="movTipo" required>
                <option value="ENTRADA">Entrada</option>
                <option value="SALIDA">Salida</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Cantidad <span class="text-danger">*</span></label>
              <input type="number" class="form-control" id="movCantidad" min="1" step="1" required>
            </div>
          </div>
          <div class="mb-3 mt-3">
            <label class="form-label">Referencia</label>
            <input type="text" class="form-control" id="movReferencia" maxlength="100" placeholder="Ej. R-0001, devoluci&oacute;n, merma...">
          </div>
          <div class="mb-2">
            <label class="form-label">Observaciones</label>
            <textarea class="form-control" id="movObservacion" rows="2" maxlength="500"></textarea>
          </div>
        </form>
      </div>
      <div class="modal-footer border-0">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary px-4 ripple" id="btnConfirmarMovimiento">
          <i class="fas fa-check me-1"></i> Registrar
        </button>
      </div>
    </div>
  </div>
</div>
