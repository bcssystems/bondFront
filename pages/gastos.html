<div class="page-content">
  <div class="page-header">
    <div>
      <h4><i class="fas fa-money-bill-wave me-2" style="color:var(--primary)"></i>Gastos</h4>
      <small class="text-muted">Solicitud y autorizaci&oacute;n de gastos</small>
    </div>
  </div>

  <div class="filter-bar">
    <select class="form-select" id="filtroCajaGasto" style="min-width:220px">
      <option value="">Todas las cajas</option>
    </select>
    <div class="btn-group" role="group">
      <input type="radio" class="btn-check" name="filtroGasto" id="filtroGastoPendientes" value="pendientes" checked>
      <label class="btn btn-outline-warning btn-sm" for="filtroGastoPendientes"><i class="fas fa-clock me-1"></i> Pendientes</label>
      <input type="radio" class="btn-check" name="filtroGasto" id="filtroGastoAutorizados" value="autorizados">
      <label class="btn btn-outline-success btn-sm" for="filtroGastoAutorizados"><i class="fas fa-check me-1"></i> Autorizados</label>
      <input type="radio" class="btn-check" name="filtroGasto" id="filtroGastoRechazados" value="rechazados">
      <label class="btn btn-outline-danger btn-sm" for="filtroGastoRechazados"><i class="fas fa-times me-1"></i> Rechazados</label>
      <input type="radio" class="btn-check" name="filtroGasto" id="filtroGastoTodos" value="todos">
      <label class="btn btn-outline-secondary btn-sm" for="filtroGastoTodos"><i class="fas fa-list me-1"></i> Todos</label>
    </div>
  </div>

  <div class="panel-card overflow-hidden">
    <div class="table-responsive">
      <table class="table table-custom mb-0">
        <thead>
          <tr>
            <th>Caja</th>
            <th>Sucursal</th>
            <th>Descripci&oacute;n</th>
            <th>Monto</th>
            <th>Solicit&oacute;</th>
            <th>Estado</th>
            <th>Fecha</th>
            <th style="width:120px"></th>
          </tr>
        </thead>
        <tbody id="tableGastosBody">
          <tr><td colspan="8"><div class="empty-state"><i class="fas fa-money-bill-wave"></i><p>Cargando...</p></div></td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
