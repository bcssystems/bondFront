<div class="page-content">
  <div class="page-header">
    <div>
      <h4><i class="fas fa-user-shield me-2" style="color:var(--primary)"></i>Roles y Permisos</h4>
      <small class="text-muted">Gesti&oacute;n de roles y sus permisos</small>
    </div>
    <button class="btn btn-primary ripple" id="btnNuevoRol">
      <i class="fas fa-plus me-1"></i> Nuevo Rol
    </button>
  </div>

  <div class="panel-card overflow-hidden">
    <div class="table-responsive">
      <table class="table table-custom mb-0">
        <thead>
          <tr>
            <th>Rol</th>
            <th>Descripci&oacute;n</th>
            <th>Permisos</th>
            <th>Tipo</th>
            <th>Estado</th>
            <th style="width:100px"></th>
          </tr>
        </thead>
        <tbody id="tableRolesBody">
          <tr><td colspan="6"><div class="empty-state"><i class="fas fa-user-shield"></i><p>Cargando...</p></div></td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<div class="modal fade" id="rolModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content border-0 shadow">
      <div class="modal-header border-0">
        <h5 class="modal-title fw-bold" id="rolModalTitle">Nuevo Rol</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="formRol">
          <input type="hidden" id="rolId">
          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label class="form-label">Nombre <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="rolNombre" required maxlength="50">
            </div>
            <div class="col-md-6">
              <label class="form-label">Descripci&oacute;n</label>
              <input type="text" class="form-control" id="rolDescripcion" maxlength="255">
            </div>
          </div>
          <label class="form-label">Permisos <span class="text-danger">*</span></label>
          <div class="border rounded p-3" style="max-height:340px;overflow-y:auto" id="rolPermisosContainer">
            <div class="text-muted small">Cargando permisos...</div>
          </div>
          <div class="form-check mt-2">
            <input type="checkbox" class="form-check-input" id="rolSeleccionarTodos">
            <label class="form-check-label" for="rolSeleccionarTodos">Seleccionar todos</label>
          </div>
        </form>
      </div>
      <div class="modal-footer border-0">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary px-4 ripple" id="btnGuardarRol">Guardar</button>
      </div>
    </div>
  </div>
</div>
