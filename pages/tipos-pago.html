<div class="page-content">
  <div class="page-header">
    <div>
      <h4><i class="fas fa-credit-card me-2" style="color:var(--primary)"></i>Tipos de Pago</h4>
      <small class="text-muted">Gesti&oacute;n de m&eacute;todos de pago disponibles</small>
    </div>
    <button class="btn btn-primary ripple" id="btnNuevoTipoPago">
      <i class="fas fa-plus me-1"></i> Nuevo Tipo
    </button>
  </div>

  <div class="panel-card overflow-hidden">
    <div class="table-responsive">
      <table class="table table-custom mb-0">
        <thead>
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Activo</th>
            <th style="width:120px"></th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr><td colspan="4"><div class="empty-state"><i class="fas fa-credit-card"></i><p>Cargando...</p></div></td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<div class="modal fade" id="tipoPagoModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-sm">
    <div class="modal-content border-0 shadow">
      <div class="modal-header border-0">
        <h5 class="modal-title fw-bold" id="tipoPagoModalTitle">Nuevo Tipo de Pago</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="formTipoPago">
          <input type="hidden" id="tipoPagoId">
          <div class="mb-3">
            <label class="form-label">Nombre <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="tipoPagoNombre" required maxlength="100" placeholder="Ej. Efectivo, Tarjeta, Transferencia">
          </div>
        </form>
      </div>
      <div class="modal-footer border-0">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary px-4 ripple" id="btnGuardarTipoPago">Guardar</button>
      </div>
    </div>
  </div>
</div>
