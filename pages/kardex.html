<div class="page-content">
  <div class="page-header">
    <div>
      <h4><i class="fas fa-book me-2" style="color:var(--primary)"></i>Kardex</h4>
      <small class="text-muted">Historial de movimientos de inventario</small>
    </div>
    <div class="d-flex gap-2">
      <button class="btn btn-outline-primary ripple" id="btnExportarKardex">
        <i class="fas fa-file-csv me-1"></i> CSV
      </button>
      <button class="btn btn-outline-success ripple" id="btnExportarKardexExcel">
        <i class="fas fa-file-excel me-1"></i> Excel
      </button>
      <button class="btn btn-outline-danger ripple" id="btnExportarKardexPdf">
        <i class="fas fa-file-pdf me-1"></i> PDF
      </button>
    </div>
  </div>

  <!-- Filters -->
  <div class="filter-bar filter-bar-5cols">
    <div>
      <label class="form-label mb-1 small text-muted">Sucursal</label>
      <select class="form-select" id="filterKardexSucursal">
        <option value="">Todas</option>
      </select>
    </div>
    <div>
      <label class="form-label mb-1 small text-muted">Desde</label>
      <input type="date" class="form-control" id="filterKardexFechaInicio">
    </div>
    <div>
      <label class="form-label mb-1 small text-muted">Hasta</label>
      <input type="date" class="form-control" id="filterKardexFechaFin">
    </div>
    <div>
      <label class="form-label mb-1 small text-muted">Tipo</label>
      <select class="form-select" id="filterKardexTipo">
        <option value="">Todos</option>
        <option value="ENTRADA">Entrada</option>
        <option value="SALIDA">Salida</option>
        <option value="AJUSTE">Ajuste</option>
        <option value="TRANSFERENCIA">Transferencia</option>
        <option value="CREACION">Creaci&oacute;n</option>
        <option value="ACTUALIZACION">Actualizaci&oacute;n</option>
        <option value="ELIMINACION">Eliminaci&oacute;n</option>
        <option value="ENTRADA_STOCK">Entrada Stock</option>
        <option value="SALIDA_STOCK">Salida Stock</option>
        <option value="AJUSTE_STOCK">Ajuste Stock</option>
        <option value="TRANSFERENCIA_STOCK">Transferencia Stock</option>
        <option value="RECEPCION_PEDIDO">Recepci&oacute;n Pedido</option>
      </select>
    </div>
  </div>

  <!-- Table -->
  <div class="panel-card overflow-hidden">
    <div class="table-responsive">
      <table class="table table-custom mb-0">
        <thead>
          <tr>
            <th>Fecha</th>
            <th>Tipo</th>
            <th>Entidad</th>
            <th>Detalle</th>
            <th>Cantidad</th>
            <th>Stock</th>
            <th>Responsable</th>
            <th>Origen</th>
          </tr>
        </thead>
        <tbody id="tableKardexBody">
          <tr><td colspan="8"><div class="empty-state"><i class="fas fa-book"></i><p>Cargando...</p></div></td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Pagination -->
  <div class="mt-3" id="paginationKardex"></div>
</div>
