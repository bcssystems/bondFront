<div class="page-content">
  <div class="page-header">
    <div>
      <h4><i class="fas fa-calculator me-2" style="color:var(--primary)"></i>Cortes de Caja</h4>
      <small class="text-muted">Hist&oacute;rico de cortes realizados por sucursal, caja y periodo</small>
    </div>
  </div>

  <div class="panel-card p-3 mb-3">
    <div class="row g-2 align-items-end">
      <div class="col-md-3">
        <label class="form-label small">Sucursal</label>
        <select class="form-select form-select-sm" id="filterSucursal">
          <option value="">Todas</option>
        </select>
      </div>
      <div class="col-md-3">
        <label class="form-label small">Caja</label>
        <select class="form-select form-select-sm" id="filterCaja">
          <option value="">Todas</option>
        </select>
      </div>
      <div class="col-md-2">
        <label class="form-label small">Desde</label>
        <input type="date" class="form-control form-control-sm" id="filterDesde">
      </div>
      <div class="col-md-2">
        <label class="form-label small">Hasta</label>
        <input type="date" class="form-control form-control-sm" id="filterHasta">
      </div>
      <div class="col-md-2 d-flex gap-1 align-items-end">
        <button class="btn btn-primary btn-sm px-4 ripple" id="btnFiltrar">
          <i class="fas fa-search me-1"></i> Buscar
        </button>
        <button class="btn btn-outline-secondary btn-sm px-4 ripple" id="btnLimpiar">
          <i class="fas fa-eraser me-1"></i> Limpiar
        </button>
      </div>
    </div>
  </div>

  <div class="panel-card overflow-hidden">
    <div class="table-responsive">
      <table class="table table-custom mb-0">
        <thead>
          <tr>
            <th>ID</th>
            <th>Caja</th>
            <th>Sucursal</th>
            <th>Saldo Inicial</th>
            <th>Ventas</th>
            <th>Ingresos</th>
            <th>Egresos</th>
            <th>Saldo Final</th>
            <th>Apertura</th>
            <th>Cierre</th>
            <th>Usuario</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr><td colspan="12"><div class="empty-state"><i class="fas fa-calculator"></i><p>Selecciona filtros y presiona Buscar</p></div></td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="mt-3" id="pagination"></div>
</div>

<!-- Corte Detail Modal -->
<div class="modal fade" id="corteDetailModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content border-0 shadow">
      <div class="modal-header border-0">
        <h5 class="modal-title fw-bold">
          <i class="fas fa-calculator me-2" style="color:var(--primary)"></i>
          Corte #<span id="corteDetailId">-</span>
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="row g-3" id="corteDetailBody"></div>
        <hr>
        <div class="text-center">
          <button class="btn btn-primary px-4 ripple" id="btnReimprimirCorte">
            <i class="fas fa-print me-1"></i> Reimprimir Ticket
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
