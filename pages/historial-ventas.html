<div class="page-content">
  <div class="page-header">
    <div>
      <h4><i class="fas fa-history me-2" style="color:var(--primary)"></i>Historial de Ventas</h4>
      <small class="text-muted">Consulta de ventas por sucursal, caja y periodo</small>
    </div>
  </div>

  <div class="panel-card p-3 mb-3">
    <div class="row g-2 align-items-end">
      <div class="col-md-3">
        <label class="form-label small">Sucursal</label>
        <select class="form-select form-select-sm" id="filterSucursal">
          <option value="">Todas</option>
        </select>
      </div>
      <div class="col-md-3">
        <label class="form-label small">Caja</label>
        <select class="form-select form-select-sm" id="filterCaja">
          <option value="">Todas</option>
        </select>
      </div>
      <div class="col-md-2">
        <label class="form-label small">Estado</label>
        <select class="form-select form-select-sm" id="filterEstado">
          <option value="">Todos</option>
          <option value="COMPLETADA">Completada</option>
          <option value="CANCELADA">Cancelada</option>
          <option value="ESPERA">Espera</option>
          <option value="SOLICITADA_CANCELACION">Solicitada cancelaci&oacute;n</option>
        </select>
      </div>
      <div class="col-md-2">
        <label class="form-label small">Desde</label>
        <input type="date" class="form-control form-control-sm" id="filterDesde">
      </div>
      <div class="col-md-2">
        <label class="form-label small">Hasta</label>
        <input type="date" class="form-control form-control-sm" id="filterHasta">
      </div>
      <div class="col-md-12 d-flex justify-content-end mt-2">
        <button class="btn btn-primary btn-sm px-4 ripple" id="btnFiltrar">
          <i class="fas fa-search me-1"></i> Buscar
        </button>
        <button class="btn btn-outline-secondary btn-sm ms-2 ripple" id="btnLimpiar">
          <i class="fas fa-eraser me-1"></i> Limpiar
        </button>
      </div>
    </div>
  </div>

  <!-- Stats -->
  <div class="row g-3 mb-3 d-none" id="statsRow">
    <div class="col-md-3 col-6">
      <div class="panel-card p-2 text-center">
        <small class="text-muted">Total Ventas</small>
        <div class="h5 mb-0 fw-bold" id="statsCount">0</div>
      </div>
    </div>
    <div class="col-md-3 col-6">
      <div class="panel-card p-2 text-center">
        <small class="text-muted">Monto Total</small>
        <div class="h5 mb-0 fw-bold" style="color:var(--primary)" id="statsTotal">$0.00</div>
      </div>
    </div>
    <div class="col-md-3 col-6">
      <div class="panel-card p-2 text-center">
        <small class="text-muted">Completadas</small>
        <div class="h5 mb-0 fw-bold text-success" id="statsCompletadas">0</div>
      </div>
    </div>
    <div class="col-md-3 col-6">
      <div class="panel-card p-2 text-center">
        <small class="text-muted">Canceladas</small>
        <div class="h5 mb-0 fw-bold text-danger" id="statsCanceladas">0</div>
      </div>
    </div>
  </div>

  <div class="panel-card overflow-hidden">
    <div class="table-responsive">
      <table class="table table-custom mb-0">
        <thead>
          <tr>
            <th>ID</th>
            <th>Sucursal</th>
            <th>Caja</th>
            <th>Cliente</th>
            <th>Total</th>
            <th>Estado</th>
            <th>Fecha</th>
            <th style="width:150px"></th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr><td colspan="8"><div class="empty-state"><i class="fas fa-receipt"></i><p>Selecciona filtros y presiona Buscar</p></div></td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="mt-3" id="pagination"></div>
</div>

<!-- Detalle Modal -->
<div class="modal fade" id="detalleModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content border-0 shadow">
      <div class="modal-header border-0">
        <h5 class="modal-title fw-bold">Detalle de Venta</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="detalleBody"></div>
      <div class="modal-footer border-0">
        <button type="button" class="btn btn-light btn-sm" data-bs-dismiss="modal">Cerrar</button>
      </div>
    </div>
  </div>
</div>
