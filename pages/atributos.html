<div class="page-content">
  <div class="page-header">
    <div>
      <h4><i class="fas fa-tags me-2" style="color:var(--primary)"></i>Atributos</h4>
      <small class="text-muted">Gesti&oacute;n de atributos para variantes de productos</small>
    </div>
    <button class="btn btn-primary ripple" id="btnNuevoAtributo">
      <i class="fas fa-plus me-1"></i> Nuevo Atributo
    </button>
  </div>

  <div class="panel-card overflow-hidden">
    <div class="table-responsive">
      <table class="table table-custom mb-0">
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Valores</th>
            <th>Estado</th>
            <th style="width:100px"></th>
          </tr>
        </thead>
        <tbody id="tableAtributosBody">
          <tr><td colspan="4"><div class="empty-state"><i class="fas fa-tags"></i><p>Cargando...</p></div></td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<div class="modal fade" id="atributoModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow">
      <div class="modal-header border-0">
        <h5 class="modal-title fw-bold" id="atributoModalTitle">Nuevo Atributo</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="formAtributo">
          <input type="hidden" id="atributoId">
          <div class="mb-3">
            <label class="form-label">Nombre <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="atributoNombre" required maxlength="100">
          </div>
          <div class="mb-3">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <label class="form-label mb-0">Valores</label>
              <button type="button" class="btn btn-sm btn-outline-primary" id="btnAgregarValor">
                <i class="fas fa-plus"></i> Agregar
              </button>
            </div>
            <div id="atributoValoresContainer">
              <div class="text-muted small">No hay valores agregados</div>
            </div>
          </div>
          <div class="form-check">
            <input type="checkbox" class="form-check-input" id="atributoActivo" checked>
            <label class="form-check-label" for="atributoActivo">Atributo activo</label>
          </div>
        </form>
      </div>
      <div class="modal-footer border-0">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary px-4 ripple" id="btnGuardarAtributo">Guardar</button>
      </div>
    </div>
  </div>
</div>
