<div class="page-content">
  <div class="page-header">
    <div>
      <h4><i class="fas fa-ban me-2" style="color:var(--primary)"></i>Cancelaciones de Venta</h4>
      <small class="text-muted">Solicitudes de cancelaci&oacute;n y ventas canceladas</small>
    </div>
  </div>

  <ul class="nav nav-tabs module-tabs mb-3" id="cancelTabs" role="tablist">
    <li class="nav-item">
      <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#cancelPendientesTab" type="button">
        <i class="fas fa-clock me-1"></i> Pendientes
      </button>
    </li>
    <li class="nav-item">
      <button class="nav-link" data-bs-toggle="tab" data-bs-target="#cancelHistorialTab" type="button">
        <i class="fas fa-history me-1"></i> Historial
      </button>
    </li>
  </ul>

  <div class="tab-content">
    <div class="tab-pane fade show active" id="cancelPendientesTab">
      <div class="row g-3 mb-3 d-none" id="cancelStatsRow">
        <div class="col-md-3 col-6">
          <div class="panel-card p-2 text-center">
            <small class="text-muted">Pendientes</small>
            <div class="h5 mb-0 fw-bold" style="color:var(--warning)" id="cancelStatsPendientes">0</div>
          </div>
        </div>
        <div class="col-md-3 col-6">
          <div class="panel-card p-2 text-center">
            <small class="text-muted">Monto en solicitud</small>
            <div class="h5 mb-0 fw-bold" style="color:var(--primary)" id="cancelStatsMonto">$0.00</div>
          </div>
        </div>
        <div class="col-md-3 col-6">
          <div class="panel-card p-2 text-center">
            <small class="text-muted">Contado</small>
            <div class="h5 mb-0 fw-bold text-success" id="cancelStatsContado">0</div>
          </div>
        </div>
        <div class="col-md-3 col-6">
          <div class="panel-card p-2 text-center">
            <small class="text-muted">Cr&eacute;dito</small>
            <div class="h5 mb-0 fw-bold text-info" id="cancelStatsCredito">0</div>
          </div>
        </div>
      </div>

      <div class="panel-card overflow-hidden">
        <div class="table-responsive">
          <table class="table table-custom mb-0">
            <thead>
              <tr>
                <th>ID</th>
                <th>Sucursal</th>
                <th>Caja</th>
                <th>Cliente</th>
                <th>Total</th>
                <th>Tipo</th>
                <th>Solicitante</th>
                <th>Motivo</th>
                <th>Fecha solicitud</th>
                <th style="width:150px"></th>
              </tr>
            </thead>
            <tbody id="cancelacionesBody">
              <tr><td colspan="10"><div class="empty-state"><i class="fas fa-ban"></i><p>Cargando...</p></div></td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="tab-pane fade" id="cancelHistorialTab">
      <div class="filter-bar">
        <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;width:100%">
          <div class="input-group input-group-sm" style="max-width:320px">
            <span class="input-group-text"><i class="fas fa-search"></i></span>
            <input type="text" class="form-control" id="historialBusqueda" placeholder="Buscar por ID, cliente, sucursal...">
          </div>
          <div class="ms-auto">
            <button type="button" class="btn btn-sm btn-outline-success ripple" id="btnExportHistorial"><i class="fas fa-file-excel me-1"></i> Excel</button>
          </div>
        </div>
      </div>
      <div class="panel-card overflow-hidden">
        <div class="table-responsive">
          <table class="table table-custom mb-0">
            <thead>
              <tr>
                <th>ID</th>
                <th>Sucursal</th>
                <th>Caja</th>
                <th>Cliente</th>
                <th>Total</th>
                <th>Tipo</th>
                <th>Cancel&oacute;</th>
                <th>Motivo</th>
                <th>Fecha cancelaci&oacute;n</th>
                <th style="width:90px"></th>
              </tr>
            </thead>
            <tbody id="cancelHistorialBody">
              <tr><td colspan="10"><div class="empty-state"><i class="fas fa-history"></i><p>Cargando...</p></div></td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
