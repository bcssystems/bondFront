<div class="page-content">
  <div class="page-header">
    <div>
      <h4><i class="fas fa-sliders-h me-2" style="color:var(--primary)"></i>Configuraci&oacute;n del sistema</h4>
      <small class="text-muted">Par&aacute;metros generales de Bonds</small>
    </div>
    <button class="btn btn-primary btn-sm" id="btnGuardarConfig"><i class="fas fa-save me-1"></i>Guardar todo</button>
  </div>

  <div class="row g-3">
    <div class="col-md-6">
      <div class="panel-card p-3">
        <h6 class="fw-semibold mb-1"><i class="fas fa-wallet me-2" style="color:var(--primary)"></i>Caja chica</h6>
        <small class="text-muted d-block mb-3">Fondo con el que se abre la caja chica</small>
        <label class="form-label small fw-semibold">Fondo de caja chica ($)</label>
        <input type="number" class="form-control" id="cfg-fondoCajaChica" step="0.01" min="0">
        <div class="form-text" id="desc-fondoCajaChica"></div>
      </div>
    </div>

    <div class="col-md-6">
      <div class="panel-card p-3">
        <h6 class="fw-semibold mb-1"><i class="fas fa-file-invoice-dollar me-2" style="color:var(--primary)"></i>Pagar&eacute;</h6>
        <small class="text-muted d-block mb-3">Datos que aparecen en el documento pagar&eacute;</small>
        <label class="form-label small fw-semibold">Tasas de inter&eacute;s mensual de mora (%)</label>
        <input type="number" class="form-control mb-3" id="cfg-tasaInteresMoraPagare" step="0.01" min="0">
        <label class="form-label small fw-semibold">Titular del pagar&eacute; (prestamista)</label>
        <input type="text" class="form-control" id="cfg-titularPagare">
      </div>
    </div>

    <div class="col-md-6">
      <div class="panel-card p-3">
        <h6 class="fw-semibold mb-1"><i class="fas fa-ban me-2" style="color:#dc2626"></i>Lista negra</h6>
        <small class="text-muted d-block mb-3">Marcado autom&aacute;tico de clientes morosos</small>
        <label class="form-label small fw-semibold">D&iacute;as sin abonar para lista negra</label>
        <input type="number" class="form-control" id="cfg-diasListaNegra" min="1">
        <div class="form-text">Se ejecuta autom&aacute;ticamente cada d&iacute;a a las 3:00 am.</div>
      </div>
    </div>

    <div class="col-md-6">
      <div class="panel-card p-3">
        <h6 class="fw-semibold mb-1"><i class="fas fa-building me-2" style="color:var(--primary)"></i>Empresa</h6>
        <small class="text-muted d-block mb-3">Encabezado en tickets y facturas</small>
        <label class="form-label small fw-semibold">Nombre / raz&oacute;n social</label>
        <input type="text" class="form-control mb-3" id="cfg-descripcionEmpresa">
        <label class="form-label small fw-semibold">Direcci&oacute;n</label>
        <input type="text" class="form-control" id="cfg-direccionEmpresa">
      </div>
    </div>
  </div>
</div>
